<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cart, Lara Berge Artworks</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&amp;family=IM+Fell+English+SC&amp;family=Alegreya:ital,wght@0,400;0,500;1,400&amp;display=swap">
<style>
body{margin:0;background:#F6F2EA}
a{text-decoration:none}
:focus-visible{outline:2px solid #6E5268;outline-offset:3px}
@keyframes slidein{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.drawer{animation:slidein .45s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion: reduce){.drawer{animation:none!important}}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #F6F2EA; font-family: 'Alegreya', Georgia, serif; color: #3B3530">
  <div aria-hidden="true" style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding-top: 40px; gap: 14px; filter: blur(1.5px)">
    <img src="/_blob/ff18e7aa95b9de3a6a96691ba2c6c378" alt="" style="width: 320px; height: auto">
    <div style="width: 1100px; height: 560px; margin-top: 60px; background: #E9E2D6; overflow: hidden"><img src="/_blob/fa7d32d443845cc0745ee11d251635ec" alt="" style="width: 50%; height: 100%; object-fit: cover"></div>
  </div>
  <a href="Painting.dc.html" aria-label="Close cart" style="position: absolute; inset: 0; background: rgba(35,30,27,.45)"></a>

  <aside class="drawer" role="dialog" aria-labelledby="cart-h" style="position: absolute; top: 0; right: 0; bottom: 0; width: 460px; max-width: 100%; background: #F6F2EA; box-shadow: -20px 0 50px -20px rgba(35,30,27,.45); display: flex; flex-direction: column">
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 26px 28px 18px; border-bottom: 1px solid #E1D8CB">
      <h2 id="cart-h" style="margin: 0; font-family: 'IM Fell English', Georgia, serif; font-weight: 400; font-size: 32px">Your cart <span style="font-size: 20px; color: #6F655D">({{count}})</span></h2>
      <a href="Painting.dc.html" aria-label="Close cart" style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; color: #3B3530">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"></path></svg>
      </a>
    </div>

    <div style="flex: 1; overflow-y: auto; padding: 8px 28px">
      <sc-for list="{{lines}}" as="l" hint-placeholder-count="2">
        <div style="display: flex; gap: 18px; padding: 20px 0; border-bottom: 1px solid #E1D8CB">
          <div style="flex: 0 0 92px; background: #FBF9F4; padding: 6px; box-shadow: 0 6px 14px -10px rgba(59,53,48,.5)"><img src="{{l.src}}" alt="" style="display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover"></div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <div style="display: flex; justify-content: space-between; gap: 10px"><span style="font-family: 'IM Fell English', Georgia, serif; font-size: 21px">[Title]</span><span style="font-family: 'IM Fell English', Georgia, serif; font-size: 19px">R[price]</span></div>
            <span style="font-size: 15px; color: #6F655D">{{l.kind}}</span>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px">
              <sc-if value="{{l.qty}}" hint-placeholder-val="{{ true }}">
                <div role="group" aria-label="Quantity" style="display: inline-flex; align-items: center; border: 1px solid #D6CCBE; border-radius: 2px">
                  <button type="button" aria-label="Fewer" onClick="{{l.dec}}" style="width: 40px; height: 40px; border: none; background: none; cursor: pointer; font-size: 20px; color: #3B3530">−</button>
                  <span style="min-width: 28px; text-align: center; font-size: 17px">{{l.n}}</span>
                  <button type="button" aria-label="More" onClick="{{l.inc}}" style="width: 40px; height: 40px; border: none; background: none; cursor: pointer; font-size: 20px; color: #3B3530">+</button>
                </div>
              </sc-if>
              <sc-if value="{{l.one}}" hint-placeholder-val="{{ false }}"><span style="font-size: 15px; font-style: italic; color: #6E5268">one of a kind</span></sc-if>
              <button type="button" onClick="{{l.remove}}" style="background: none; border: none; cursor: pointer; font-family: 'Alegreya', Georgia, serif; font-size: 15px; color: #6F655D; text-decoration: underline; min-height: 40px">Remove</button>
            </div>
          </div>
        </div>
      </sc-for>
      <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
        <div style="text-align: center; padding: 60px 10px">
          <img src="/_blob/72de11e577f9695dfaad1594357c53e2" alt="" style="width: 110px; height: auto">
          <p style="margin: 14px 0 6px; font-family: 'IM Fell English', Georgia, serif; font-size: 24px">Your cart is empty</p>
          <a href="Shop.dc.html" style="color: #6E5268; font-style: italic">wander the shop →</a>
        </div>
      </sc-if>
    </div>

    <div style="padding: 22px 28px 28px; border-top: 1px solid #E1D8CB; display: flex; flex-direction: column; gap: 10px; background: #FBF9F4">
      <div style="display: flex; justify-content: space-between; align-items: baseline"><span>Subtotal</span><span style="font-family: 'IM Fell English', Georgia, serif; font-size: 28px">R[subtotal]</span></div>
      <p style="margin: 0; font-size: 15px; color: #6F655D">Shipping is worked out at checkout.</p>
      <a href="Checkout.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; background: #6E5268; color: #FFFFFF; font-family: 'IM Fell English', Georgia, serif; font-size: 22px; border-radius: 2px; margin-top: 4px">Checkout</a>
      <a href="Shop.dc.html" style="text-align: center; color: #6E5268; font-family: 'IM Fell English', Georgia, serif; font-style: italic; font-size: 18px; min-height: 40px; display: flex; align-items: center; justify-content: center">keep browsing</a>
    </div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const B = '/_blob/';
    const removed = this.state.removed ?? {};
    const n = this.state.n ?? 1;
    const lines = [
      { id: 'a', src: B + 'fa7d32d443845cc0745ee11d251635ec', kind: 'Original oil painting · [W × H cm]', qty: false, one: true, n: 1 },
      { id: 'b', src: B + 'a7de392dff37fc5258b508faaedaad01', kind: 'Signed print · A3', qty: true, one: false, n }
    ].filter(l => !removed[l.id]).map(l => ({
      ...l,
      inc: () => this.setState({ n: n + 1 }),
      dec: () => this.setState({ n: Math.max(1, n - 1) }),
      remove: () => this.setState({ removed: { ...removed, [l.id]: true } })
    }));
    return { lines, empty: lines.length === 0, count: lines.reduce((a, l) => a + l.n, 0) };
  }
}
</script>
</body>
</html>
