<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&amp;family=IM+Fell+English+SC&amp;family=Alegreya:ital,wght@0,400;0,500;1,400&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<header style="font-family: 'Alegreya', Georgia, serif; color: #3B3530; background: #F6F2EA; position: relative; width: 100%">
  <sc-if value="{{spider}}" hint-placeholder-val="{{ true }}">
    <div aria-hidden="true" class="spider" style="position: absolute; top: 0; right: 9%; width: 34px; display: flex; flex-direction: column; align-items: center">
      <div style="width: 1px; height: 128px; background: #8A8078"></div>
      <svg width="34" height="34" viewBox="0 0 40 40" fill="none" stroke="#2F2925" stroke-width="1.6" stroke-linecap="round" style="margin-top: -4px">
        <path d="M17 18c-6-6-11-6-14-3M16 22c-7-2-11 0-14 5M16 26c-6 2-9 6-10 11M18 29c-3 3-4 6-4 9"></path>
        <path d="M23 18c6-6 11-6 14-3M24 22c7-2 11 0 14 5M24 26c6 2 9 6 10 11M22 29c3 3 4 6 4 9"></path>
        <circle cx="20" cy="14" r="4" fill="#2F2925"></circle>
        <ellipse cx="20" cy="24" rx="6" ry="7.5" fill="#2F2925"></ellipse>
      </svg>
    </div>
  </sc-if>
  <div style="max-width: 1360px; margin: 0 auto; padding: 32px 24px 8px; display: flex; flex-direction: column; align-items: center; gap: 12px; position: relative">
    <a href="Main.dc.html" aria-label="Lara Berge Artworks, home" style="display: flex; flex-direction: column; align-items: center; color: #3B3530; text-decoration: none">
      <img src="/_blob/ff18e7aa95b9de3a6a96691ba2c6c378" alt="" style="width: min(320px, 70vw); height: auto; display: block">
      <span style="font-family: 'IM Fell English SC', Georgia, serif; font-size: 17px; letter-spacing: 0.42em; padding-left: 0.42em; color: #6E5268; margin-top: 2px">artworks</span>
    </a>
    <nav class="nav" aria-label="Main" style="display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 34px; font-family: 'IM Fell English', Georgia, serif; font-size: 23px">
      <sc-for list="{{items}}" as="item" hint-placeholder-count="5">
        <sc-if value="{{item.active}}" hint-placeholder-val="{{ false }}">
          <a href="{{item.href}}" aria-current="page" style="color: #3B3530; text-decoration: none">{{item.label}}</a>
        </sc-if>
        <sc-if value="{{item.inactive}}" hint-placeholder-val="{{ true }}">
          <a href="{{item.href}}" style="color: #3B3530; text-decoration: none">{{item.label}}</a>
        </sc-if>
      </sc-for>
    </nav>
    <a href="Cart.dc.html" aria-label="Cart, {{cart}} items" style="position: absolute; top: 36px; right: 24px; display: flex; align-items: center; gap: 6px; min-height: 44px; min-width: 44px; justify-content: center; font-family: 'IM Fell English', Georgia, serif; font-size: 19px; color: #3B3530; text-decoration: none">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 11.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8L5 8z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>
      <span>{{cart}}</span>
    </a>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"current":{"editor":"enum","options":["Home","Gallery","Shop","About","Contact","none"],"default":"Home"},"cart":{"editor":"int","default":0},"spider":{"editor":"boolean","default":true},"$preview":{"width":1440,"height":240}}'>
class Component extends DCLogic {
  renderVals() {
    const cur = this.props.current ?? 'Home';
    const links = [['Home','Main.dc.html'],['Gallery','Gallery.dc.html'],['Shop','Shop.dc.html'],['About','About.dc.html'],['Contact','Contact.dc.html']];
    return {
      items: links.map(([label, href]) => ({ label, href, active: label === cur, inactive: label !== cur })),
      cart: this.props.cart ?? 0,
      spider: this.props.spider ?? true
    };
  }
}
</script>
</body>
</html>
